name: CI Pipeline

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('package.json') != '' && hashFiles('eslint.config.js') != '' }}
        run: npm run lint

      - name: Build or type check
        if: ${{ hashFiles('package.json') != '' && hashFiles('tsconfig.json') != '' }}
        run: npm run typecheck

      - name: Test
        if: ${{ hashFiles('package.json') != '' && (hashFiles('src/**/*.ts') != '' || hashFiles('test/**/*.ts') != '' || hashFiles('tests/**/*.ts') != '') }}
        run: npm test

      - name: Summary
        if: always()
        run: |
          {
            echo "Node.js ${{ matrix.node-version }}: CI completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"
